h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1F3864;color:#fff;padding:7px 3px;font-weight:600;text-align:center}

.btn.sec{background:var(--card);color:var(--pri);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--pri);font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline;font-family:inherit}
.match{display:grid;grid-template-columns:1fr 58px;gap:6px 8px;align-items:center}
.match .tn{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.match .mm{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:-2px}
.match.me{background:var(--hl);margin:-4px;padding:4px;border-radius:8px}

.scv{font-size:20px;font-weight:700;text-align:center;padding:6px 0}
.sc:focus,.ctl input:focus{outline:2px solid var(--acc)}
.sep{height:1px;background:var(--line);margin:10px 0}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--mute);font-weight:400}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin-right:4px;font-weight:600}
.tag.of{background:rgba(30,142,62,.16);color:var(--ok)}
.tag.pr{background:var(--line);color:var(--mute)}
.tag.np{background:rgba(197,34,31,.14);color:var(--bad)}
.tag.ad{background:rgba(232,113,10,.16);color:var(--acc)}
select.big,input.txt{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 8px;font-family:inherit}
label.f{display:block;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.mini{display:grid;gap:8px}
.mini div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px}
.mini span{display:block;font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.bx{display:flex;gap:3px;margin-top:3px}.bx span{flex:1;text-align:center;font-size:9px;color:var(--mute)}

.jr.hd{cursor:default;padding:0 0 4px;font-size:11px;color:var(--mute)}
.jr .ttl{font-size:13px;min-width:0}.jr .ttl b{font-size:14px}

.note{font-size:12px;color:var(--mute)}
a{color:var(--pri)}
.center{text-align:center}

  if(x && typeof x.avg==="boolean") o.avg = x.avg;
  if(x && SK.some(k=>k[0]===x.chart)) o.chart = x.chart;
  if(x && ["clas","part","jug","po"].includes(x.inicio)) o.inicio = x.inicio;
  if(x && ["jornada","equipo"].includes(x.vistaPart)) o.vistaPart = x.vistaPart;
  if(x && Array.isArray(x.comps)){ const c = COMP_IDS.filter(k=>x.comps.includes(k)); if(c.length) o.comps = c; }
  if(x && COMP_IDS.includes(x.inicioComp)) o.inicioComp = x.inicioComp;
  if(x && x.equipos && typeof x.equipos==="object"){ o.equipos = {}; for(const c of PRO_IDS) if(typeof x.equipos[c]==="string" && x.equipos[c].length<=40) o.equipos[c] = x.equipos[c]; }
  if(x && x.franquicia && typeof x.franquicia==="object"){ o.franquicia = {};
    for(const [t,l] of Object.entries(x.franquicia).slice(0,30)) if(Array.isArray(l)){ const v = l.filter(s=>typeof s==="string" && s.length<=20).slice(0,2); if(v.length) o.franquicia[t] = v; } }
  return o;
}
function normPerfil(d){

  for(const [id,x] of Object.entries(d.players && typeof d.players==="object" ? d.players : {})){
    if(!validId(id) || !x || typeof x!=="object") continue;
    p.players.push({id, name:(cleanName(x.n)||"Jugador").slice(0,60), num:String(x.num??"").replace(/\D/g,"").slice(0,3),
      team:typeof x.team==="string"?x.team:"", stats:normStats(x.stats), c:+x.c||0});

}

function perfilFromSrc(src, liga){

    players[id] = {n:p.name, num:p.num||"", team:tid(p.teamName), stats:normStats(p.stats), c:i}; });

async function readLegacy(){   // datos de la versión anterior guardados en este dispositivo
  let fromIDB = null;
  try{ if(window.indexedDB) fromIDB = await new Promise(res=>{
    const r = indexedDB.open("cadeteB");
    r.onupgradeneeded = () => { try{ r.transaction.abort(); }catch(e){} res(null); };
    r.onerror = () => res(null);
    r.onsuccess = () => { const d = r.result;
      if(!d.objectStoreNames.contains("estado")){ d.close(); res(null); return; }
      const q = d.transaction("estado").objectStore("estado").get("S");
      q.onsuccess = () => { res(q.result||null); d.close(); }; q.onerror = () => { res(null); d.close(); }; };
  }); }catch(e){}
  const best = [fromIDB, lsGet("cadeteB_pwa")].filter(x=>x&&typeof x==="object").sort((a,b)=>(+b.rev||0)-(+a.rev||0))[0];
  return best ? normalizeV2(best) : null;
}

function effMatches(){

function initJor(){ const today = todayLocal(); const m = M.slice().sort(byDate).find(x=>x.d>=today && !played(x)); jor = m ? m.j : nj(); }
function clsPts(m, side){ const me = side==="h"?m.s[0]:m.s[1], ot = side==="h"?m.s[1]:m.s[0];
  return me>ot ? L.win : me<ot ? (m.np===side ? 0 : L.loss) : L.draw; }
function standings(){
  const t = {}; L.teams.forEach(x=>t[x.id]={n:x.id,pj:0,pg:0,pe:0,pp:0,pf:0,pc:0,pts:0,hp:0,hd:0,hf:0});
  M.forEach(m=>{ if(!played(m)) return; const A=t[m.h], B=t[m.a]; if(!A||!B) return;
    const a=m.s[0], b=m.s[1]; A.pj++;B.pj++;A.pf+=a;A.pc+=b;B.pf+=b;B.pc+=a; A.pts+=clsPts(m,"h"); B.pts+=clsPts(m,"a");
    if(a>b){A.pg++;B.pp++}else if(a<b){B.pg++;A.pp++}else{A.pe++;B.pe++} });
  const arr = Object.values(t); arr.forEach(x=>{x.dif=x.pf-x.pc});
  const groups = {}; arr.forEach(x=>(groups[x.pts] = groups[x.pts] || []).push(x));
  Object.values(groups).filter(g=>g.length>1).forEach(g=>{ const ids = new Set(g.map(x=>x.n));
    M.forEach(m=>{ if(!played(m) || !ids.has(m.h) || !ids.has(m.a)) return; const A=t[m.h], B=t[m.a], a=m.s[0], b=m.s[1];
      A.hp+=clsPts(m,"h"); B.hp+=clsPts(m,"a"); A.hd+=a-b; B.hd+=b-a; A.hf+=a; B.hf+=b; }); });
  const idx = id => L.teams.findIndex(x=>x.id===id);
  return arr.sort((a,b)=>b.pts-a.pts||b.hp-a.hp||b.hd-a.hd||b.hf-a.hf||b.dif-a.dif||b.pf-a.pf||idx(a.n)-idx(b.n));
}

  if(played(m)){ const me = home?m.s[0]:m.s[1], ot = home?m.s[1]:m.s[0]; r.res = (me>ot?"G ":me<ot?"P ":"E ")+me+"-"+ot; }
  return r;
}

function bindPhase(){
  const on = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  on("reload", () => location.reload());
  on("out", logout);
  on("vre", () => fb.sendEmailVerification(user).then(()=>toast("Correo reenviado")).catch(e=>say(authErr(e))));
  on("vok", async () => { const b = $("vok"); b.disabled = true;
    try{ await fb.reload(user); await fb.getIdToken(user, true); }catch(e){ say(authErr(e)); b.disabled = false; return; }
    if(user.emailVerified){ say(); createRequest(); phase = "pendiente"; render(); }
    else{ say("Todavía no consta como confirmado. Abre el enlace del correo y vuelve a intentarlo."); b.disabled = false; } });
  on("goReg", () => { authView = "registro"; authMsg = authInfo = ""; render(); });
  on("goOlv", () => { authView = "olvido"; authMsg = authInfo = ""; render(); });
  on("goLogin", () => { authView = "login"; authMsg = authInfo = ""; render(); });
  on("mk", crearLiga);
  on("cpy", copyUid);
  // Los mensajes y el estado «ocupado» se actualizan sin volver a pintar el formulario (no se pierde lo escrito)
  const say = (warn, info) => { authMsg = warn||""; authInfo = info||""; const el = $("amsg");
    if(el) el.innerHTML = (authMsg?`<div class="warn">${esc(authMsg)}</div>`:"") + (authInfo?`<div class="info">${esc(authInfo)}</div>`:""); };
  const busy = (form, on, txt) => { authBusy = on; const b = form.querySelector("button[type=submit]"); if(!b) return;
    if(!b.dataset.t) b.dataset.t = b.textContent; b.disabled = on; b.textContent = on ? txt : b.dataset.t; };
  const fL = $("fLogin"), fR = $("fReg"), fO = $("fOlv");
  if(fL) fL.onsubmit = e => { e.preventDefault(); const em = $("le").value.trim(), pw = $("lp").value; lastEmail = em;
    say(); busy(fL, true, "Entrando…");
    fb.signInWithEmailAndPassword(auth, em, pw).catch(err=>{ busy(fL, false); say(authErr(err)); }); };
  if(fR) fR.onsubmit = e => { e.preventDefault();
    const nombre = cleanName($("rn").value).slice(0,60), em = $("re").value.trim(), pw = $("rp").value, pw2 = $("rp2").value; lastEmail = em;
    if(!nombre){ say("Escribe tu nombre."); return; }
    if(pw!==pw2){ say("Las contraseñas no coinciden."); return; }
    regNombre = nombre; say(); busy(fR, true, "Creando…");
    fb.createUserWithEmailAndPassword(auth, em, pw)
      .then(c=>Promise.all([fb.updateProfile(c.user, {displayName:nombre}).catch(()=>{}), fb.sendEmailVerification(c.user).catch(e=>console.warn(e))]))
      .catch(err=>{ busy(fR, false); say(authErr(err)); }); };
  if(fO) fO.onsubmit = e => { e.preventDefault(); const em = $("oe").value.trim(); lastEmail = em; say(); busy(fO, true, "Enviando…");
    fb.sendPasswordResetEmail(auth, em).then(()=>{ busy(fO, false); say("", "Si el correo está registrado, recibirás un enlace para elegir una contraseña nueva. Revisa también el correo no deseado."); })
      .catch(err=>{ busy(fO, false); say(authErr(err)); }); };
}
function authErr(e){
  switch(e && e.code){
    case "auth/invalid-credential": case "auth/invalid-login-credentials": case "auth/wrong-password": case "auth/user-not-found": return "Correo o contraseña incorrectos.";
    case "auth/too-many-requests": return "Demasiados intentos. Espera unos minutos y vuelve a probar.";
    case "auth/network-request-failed": return "Sin conexión. Comprueba tu red.";
    case "auth/email-already-in-use": return "Ya existe una cuenta con ese correo. Prueba a entrar o a recuperar la contraseña.";
    case "auth/weak-password": case "auth/password-does-not-meet-requirements": return "La contraseña es demasiado débil (mínimo 6 caracteres).";
    case "auth/invalid-email": case "auth/missing-email": return "El correo no es válido.";
    case "auth/operation-not-allowed": return "El acceso con correo y contraseña no está activado en Firebase.";
    default: return (e && e.message) || "Error inesperado.";
  }
}
function copyUid(){
  const id = user ? user.uid : ""; if(!id) return;
  (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(()=>toast("ID copiado"))
    .catch(()=>{ const el = $("uidv"); if(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selecciona el ID y cópialo"); });
}

const dlg = $("dlg");

dlg.addEventListener("pointerdown", e => { downOnBackdrop = e.target===dlg; });
dlg.addEventListener("click", e => { if(e.target===dlg && downOnBackdrop) closeDlg(); downOnBackdrop = false; });
dlg.addEventListener("close", () => { if(history.state && history.state.dlg) history.back(); setTimeout(maybeRender, 0); });
function openDlg(html){

function openMatch(id){

   <div class="db"><div class="row"><label class="f" style="flex:2">Fecha<input class="txt" type="date" id="md" value="${esc(m.d)}"></label>

    <p class="note">Con incomparecencia, el equipo que no se presentó suma 0 puntos. Si no hay marcador se pone 20-0.</p></div>
   <div class="df"><span style="flex:1"></span><button type="button" class="btn sec" id="dcan">Cancelar</button><button type="button" class="btn" id="dok">Guardar</button></div>`);
  $("dcan").onclick = closeDlg;

    if(h===a){ alert("Local y visitante no pueden ser el mismo equipo."); return; }
    const dup = L.matches.find(x=>x.id!==m.id && x.j===m.j && [x.h,x.a].some(t=>t===h||t===a));
    if(dup && !confirm("Ese equipo ya juega otro partido en la jornada "+m.j+". ¿Guardar igualmente?")) return;
    const swapped = h===m.a && a===m.h, chg = h!==m.h || a!==m.a;
    if(chg && !swapped && played(m) && !confirm(`Este partido tiene resultado manual (${m.s[0]}-${m.s[1]}). Se mantendrá con los equipos nuevos. ¿Continuar?`)) return;
    if(swapped){ m.s = [m.s[1], m.s[0]]; if(np===m.np) np = np==="h" ? "a" : np==="a" ? "h" : ""; }
    m.d = $("md").value; m.hora = $("mhr").value; m.h = h; m.a = a; m.np = np;
    if(np && m.s[0]==null && m.s[1]==null && !O[m.id]) m.s = np==="h" ? [0,20] : [20,0];
    saveMatch(m); closeDlg(); M = effMatches(); render(); };
}

const pad2 = n => String(n).padStart(2,"0");
const ldate = s => { if(!s) return ""; if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const d = new Date(s); return isNaN(d) ? "" : d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); };
const ltime = s => { if(!s || s.length<=10) return ""; const d = new Date(s); return isNaN(d) ? "" : pad2(d.getHours())+":"+pad2(d.getMinutes()); };
const visibleComps = () => P && P.comps && P.comps.length ? P.comps : COMP_IDS;
const chipsHtml = (list, curV, attr) => `<div class="chips">${list.map(([v,l])=>`<button class="chip ${v===curV?"on":""}" data-${attr}="${esc(v)}">${esc(l)}</button>`).join("")}</div>`;
const sid = v => String(v ?? "").slice(0,40);

function normPro(d){
  if(!d || typeof d!=="object") return null;
  const teams = (Array.isArray(d.teams)?d.teams:[]).filter(t=>t && t.id!=null).map(t=>({id:sid(t.id), n:cleanName(t.n)||sid(t.id),
    short:cleanName(t.short||t.n)||sid(t.id), ab:cleanName(t.ab||"").slice(0,8), conf:t.conf==="E"||t.conf==="W"?t.conf:""}));
  const tm = Object.fromEntries(teams.map(t=>[t.id,t]));
  const games = [];
  for(const [id,g] of Object.entries(d.games && typeof d.games==="object" ? d.games : {})){
    if(!g || typeof g!=="object") continue;
    const s = Array.isArray(g.s) && g.s.length===2 && g.s.every(x=>x!==null && Number.isFinite(+x)) ? [+g.s[0], +g.s[1]] : null;
    games.push({id:sid(id), d:typeof g.d==="string"?g.d:"", h:sid(g.h), a:sid(g.a), s, r:g.r!=null?cleanName(g.r).slice(0,40):"",
      j:Number.isFinite(+g.j) && g.j!==null ? +g.j : null, ph:typeof g.ph==="string"?g.ph.slice(0,4):"", ty:+g.ty||0, st:typeof g.st==="string"?g.st:"",
      nota:typeof g.nota==="string"?g.nota.slice(0,60):""});
  }
  games.sort((a,b)=>(a.d||"").localeCompare(b.d||"") || a.id.localeCompare(b.id));
  const st = d.standings;
  const row = r => ({id:sid(r.id), seed:+r.seed||null, pos:+r.pos||null, w:+r.w||0, l:+r.l||0, pct:String(r.pct??""), gb:String(r.gb??""), racha:String(r.racha??""), pf:+r.pf||0, pa:+r.pa||0});
  const standings = Array.isArray(st) ? st.filter(r=>r&&r.id!=null).map(row)
    : st && typeof st==="object" ? {E:(Array.isArray(st.E)?st.E:[]).filter(r=>r&&r.id!=null).map(row), W:(Array.isArray(st.W)?st.W:[]).filter(r=>r&&r.id!=null).map(row)} : null;
  return {teams, tm, games, standings, act:toDate(d.actualizado), season:d.season};
}
function normRost(d){
  const teams = {};
  for(const [t,l] of Object.entries(d && d.teams && typeof d.teams==="object" ? d.teams : {}))
    if(Array.isArray(l)) teams[sid(t)] = l.filter(p=>p&&p.id).map(p=>({id:sid(p.id), n:cleanName(p.n)||"Jugador", num:sid(p.num).slice(0,3), pos:sid(p.pos).slice(0,4), pais:cleanName(p.pais).slice(0,30)}));
  return {teams, esp:(d && Array.isArray(d.espanolesAuto) ? d.espanolesAuto.map(sid) : [])};
}
// Sin decisión del admin todavía: Hugo González (su ficha de ESPN no indica lugar de nacimiento)
function normEspa(d){ if(!d) return {add:["5175647"], quitar:[]}; const e = d.espanoles || {}; return {add:(Array.isArray(e.add)?e.add:[]).map(sid), quitar:(Array.isArray(e.quitar)?e.quitar:[]).map(sid)}; }
function normNbaj(d){
  if(!d) return null; const g = {};
  for(const [k,x] of Object.entries(d.g && typeof d.g==="object" ? d.g : {})) if(Array.isArray(x)) g[k] = x.slice(0,5).map(v=>Number.isFinite(+v)?+v:0);
  return {n:cleanName(d.n)||"Jugador", t:sid(d.t), num:sid(d.num).slice(0,3), pos:sid(d.pos).slice(0,4), pais:cleanName(d.pais).slice(0,30), g};
}
const ptn = (c,id) => { const t = PRO[c] && PRO[c].tm[id]; return t ? t.short : "¿?"; };
const pab = (c,id) => { const t = PRO[c] && PRO[c].tm[id]; return t ? (t.ab || t.short) : "?"; };
const isRS = (c,g) => c==="nba" ? g.ty===2 : c==="euroliga" ? (g.ph||"RS")==="RS" : g.j!=null;
const favOf = c => (P && P.equipos && P.equipos[c]) || "";
function noData(c){ return `<div class="card"><h2>${esc(COMPS[c].t)}</h2><p class="note">Todavía no hay datos. Se cargan automáticamente cada día a las 7:00${isAdmin?". Para cargarlos ahora: GitHub → Actions → «NBA, ACB y Euroliga» → Run workflow":""}.</p></div>`; }
const updNote = c => PRO[c] && PRO[c].act ? `<p class="note">Actualizado el ${esc(fdt(PRO[c].act))}.</p>` : "";

// Clasificación con desempates por enfrentamientos directos (criterio ACB y Euroliga)
function proStandings(c){
  const D = PRO[c], t = {};
  D.teams.forEach(x=>t[x.id]={id:x.id,pj:0,w:0,l:0,pf:0,pa:0,hw:0,hd:0,hf:0});
  const rs = D.games.filter(g=>g.s && isRS(c,g));
  rs.forEach(g=>{ const A=t[g.h], B=t[g.a]; if(!A||!B) return; const [a,b]=g.s; A.pj++;B.pj++;A.pf+=a;A.pa+=b;B.pf+=b;B.pa+=a; if(a>b){A.w++;B.l++}else{B.w++;A.l++} });
  const arr = Object.values(t), groups = {};
  arr.forEach(x=>(groups[x.w] = groups[x.w] || []).push(x));
  Object.values(groups).filter(g=>g.length>1).forEach(g=>{ const ids = new Set(g.map(x=>x.id));
    rs.forEach(m=>{ if(!ids.has(m.h)||!ids.has(m.a)) return; const A=t[m.h], B=t[m.a], [a,b]=m.s; if(a>b) A.hw++; else B.hw++; A.hd+=a-b; B.hd+=b-a; A.hf+=a; B.hf+=b; }); });
  return arr.sort((a,b)=>b.w-a.w||b.hw-a.hw||b.hd-a.hd||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf||a.id.localeCompare(b.id)).map((x,i)=>({...x, pos:i+1}));
}
function nbaRows(conf){
  const D = PRO.nba, st = D.standings && !Array.isArray(D.standings) && D.standings[conf];
  if(st && st.length) return st.map((r,i)=>({...r, seed:r.seed||i+1})).sort((a,b)=>a.seed-b.seed);
  const t = {}; D.teams.filter(x=>x.conf===conf).forEach(x=>t[x.id]={id:x.id,w:0,l:0});
  D.games.forEach(g=>{ if(g.ty!==2||!g.s) return; const [a,b] = g.s; if(t[g.h]) a>b?t[g.h].w++:t[g.h].l++; if(t[g.a]) b>a?t[g.a].w++:t[g.a].l++; });
  const arr = Object.values(t).map(x=>({...x, p:x.w+x.l?x.w/(x.w+x.l):0})).sort((a,b)=>b.p-a.p||b.w-a.w);
  const top = arr[0];
  return arr.map((x,i)=>({id:x.id, seed:i+1, w:x.w, l:x.l, pct:x.p.toFixed(3).replace(/^0/,""), gb:i&&top?String(((top.w-x.w)+(x.l-top.l))/2):"-", racha:""}));
}
function elRows(){
  const D = PRO.euroliga;
  if(Array.isArray(D.standings) && D.standings.length) return D.standings.slice().sort((a,b)=>(a.pos||99)-(b.pos||99)).map((r,i)=>({...r, pos:r.pos||i+1, pj:r.w+r.l}));
  return proStandings("euroliga");
}
const zone = (c, pos, n) => c==="acb" ? (pos<=8 ? "zpo" : pos>n-2 ? "zde" : "") : (pos<=6 ? "zpo" : pos<=10 ? "zpi" : "");
const legend = c => `<div class="leg">${c==="acb"
  ? `<span><i style="background:var(--ok)"></i>Playoff (1-8)</span><span><i style="background:var(--bad)"></i>Descenso (17-18)</span>`
  : `<span><i style="background:var(--ok)"></i>Playoffs (1-6)</span><span><i style="background:var(--acc)"></i>Play-In (7-10)</span>`}</div>`;

function vProClas(c){
  const D = PRO[c]; if(!D) return noData(c);
  const fav = favOf(c), nm = id => `<td class="t"><b style="font-weight:inherit">${esc(ptn(c,id))}</b><small>${esc(pab(c,id))}</small></td>`;
  if(c==="nba"){
    const conf = pv.nba.conf, rows = nbaRows(conf);
    return chipsHtml([["E","Este"],["W","Oeste"]], conf, "nconf") + `<div class="card"><h2>Conferencia ${conf==="E"?"Este":"Oeste"}</h2>
      <table class="pro"><tr><th>#</th><th style="text-align:left">Equipo</th><th>V</th><th>D</th><th>%</th><th>Dif.</th><th>Racha</th></tr>
      ${rows.map(r=>`<tr class="${zone(c,r.seed)} ${r.id===fav?"me":""}"><td>${r.seed}</td>${nm(r.id)}<td>${r.w}</td><td>${r.l}</td><td>${esc(r.pct)}</td><td>${esc(r.gb)}</td><td>${esc(r.racha)}</td></tr>`).join("")}
      </table>${legend(c)}<p class="note">«Dif.»: partidos por detrás del primero. Orden oficial con los desempates de la NBA.</p>${updNote(c)}</div>`;
  }
  const rows = c==="euroliga" ? elRows() : proStandings(c), n = rows.length;
  return `<div class="card"><h2>Clasificación <span class="badge">${D.games.filter(g=>g.s&&isRS(c,g)).length}/${D.games.filter(g=>isRS(c,g)).length} partidos</span></h2>
    <table class="pro"><tr><th>#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>V</th><th>D</th><th>Dif.</th></tr>
    ${rows.map(r=>`<tr class="${zone(c,r.pos,n)} ${r.id===fav?"me":""}"><td>${r.pos}</td>${nm(r.id)}<td>${r.pj??(r.w+r.l)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf-r.pa>0?"+":""}${r.pf-r.pa}</td></tr>`).join("")}
    </table>${legend(c)}<p class="note">${c==="acb"
      ? "Desempate: victorias en los enfrentamientos entre los empatados, su diferencia de puntos y después la diferencia general. A la Copa del Rey van los 8 primeros al terminar la primera vuelta (jornada 17)."
      : "Clasificación oficial de la Euroliga."}</p>${updNote(c)}</div>`;
}

function gameRow(c, g, fav){
  const nbaOrder = c==="nba";                         // en la NBA se escribe primero el visitante
  const [t1, t2, s1, s2] = nbaOrder ? [g.a, g.h, g.s&&g.s[1], g.s&&g.s[0]] : [g.h, g.a, g.s&&g.s[0], g.s&&g.s[1]];
  const w1 = g.s && s1>s2, w2 = g.s && s2>s1;
  const ph = g.s ? "Final" : ltime(g.d) || "";
  const tag = c==="nba" ? (g.ty===5 ? "Play-In" : g.ty===3 ? "Playoffs" : g.nota) : c==="euroliga" ? ({PI:"Play-In", PO:"Playoffs", FF:"Final Four"}[g.ph]||"") : (g.j==null ? g.r : "");
  return `<div class="pg ${fav&&(g.h===fav||g.a===fav)?"me":""}"><div class="ph">${esc(ph)}</div>
    <div class="pn ${w1?"w":g.s?"lo":""}">${esc(ptn(c,t1))}</div><div class="ps">${g.s?s1:""}</div>
    <div class="pn ${w2?"w":g.s?"lo":""}">${nbaOrder?"@ ":""}${esc(ptn(c,t2))}</div><div class="ps">${g.s?s2:""}</div>
    ${tag?`<div class="pm">${esc(tag)}</div>`:""}</div>`;
}
function teamRow(c, g, fav){
  const home = g.h===fav, opp = home ? g.a : g.h;
  let res = "–";
  if(g.s){ const me = home?g.s[0]:g.s[1], ot = home?g.s[1]:g.s[0]; res = (me>ot?"G ":"P ")+me+"-"+ot; }

// Series de eliminatoria a partir de los partidos (agrupados por pareja de equipos)
function seriesOf(games){
  const m = new Map();
  games.forEach(g=>{ const [x,y] = [g.h,g.a].sort(), k = x+"|"+y;
    if(!m.has(k)) m.set(k, {a:x, b:y, wa:0, wb:0, first:g.d||"", games:[]});
    const s = m.get(k); s.games.push(g); if((g.d||"")<s.first) s.first = g.d;
    if(g.s){ const win = g.s[0]>g.s[1] ? g.h : g.a; if(win===s.a) s.wa++; else s.wb++; } });
  const arr = [...m.values()].sort((p,q)=>p.first.localeCompare(q.first)), cnt = {};
  arr.forEach(s=>{ s.round = Math.max(cnt[s.a]||0, cnt[s.b]||0)+1; cnt[s.a] = cnt[s.b] = s.round; });
  return arr;
}
function seriesCard(c, s, need){
  const fav = favOf(c), done = s.wa>=need || s.wb>=need, lead = s.wa>s.wb ? s.a : s.wb>s.wa ? s.b : null;
  const txt = done ? `Gana ${ptn(c, s.wa>=need?s.a:s.b)}` : lead ? `Domina ${ptn(c,lead)}` : s.wa+s.wb ? "Empate" : "Por empezar";
  return `<div class="sr ${done?"win":""}" ${fav&&(s.a===fav||s.b===fav)?'style="outline:2px solid var(--acc)"':""}>
    <div class="l"><span>${esc(ptn(c,s.a))}</span><b>${s.wa}</b></div><div class="l"><span>${esc(ptn(c,s.b))}</span><b>${s.wb}</b></div><small>${esc(txt)} · al mejor de ${need*2-1}</small></div>`;
}
const single = (c,g) => `<div class="sr"><div class="l"><span>${esc(ptn(c,g.h))}</span><b>${g.s?g.s[0]:""}</b></div><div class="l"><span>${esc(ptn(c,g.a))}</span><b>${g.s?g.s[1]:""}</b></div><small>${g.s?"Final":fdate(ldate(g.d))+(ltime(g.d)?" · "+ltime(g.d):"")}</small></div>`;
const proj = (x, y, note) => `<div class="sr"><div class="l"><span>${x}</span></div><div class="l"><span>${y}</span></div>${note?`<small>${esc(note)}</small>`:""}</div>`;
function vProPO(c){

  let html = "";

    const ser = seriesOf(po).filter(s=>(D.tm[s.a]||{}).conf===conf || (D.tm[s.b]||{}).conf!==(D.tm[s.a]||{}).conf);
    const names = {1:"Primera ronda", 2:"Semifinales de conferencia", 3:"Final de conferencia", 4:"Finales de la NBA"};
    if(ser.length) [1,2,3,4].forEach(r=>{ const x = ser.filter(s=>s.round===r); if(x.length) html += `<div class="card"><h2>${names[r]}</h2>${x.map(s=>seriesCard(c,s,4)).join("")}</div>`; });
    else html += `<div class="card"><h2>Primera ronda <span class="badge">si acabara hoy</span></h2>${proj(t(1,rows,"seed"),"8.º (Play-In)")}${proj(t(4,rows,"seed"),t(5,rows,"seed"))}${proj(t(3,rows,"seed"),t(6,rows,"seed"))}${proj(t(2,rows,"seed"),"7.º (Play-In)")}<p class="note">Series al mejor de 7. Los 6 primeros de cada conferencia van directos; del 7.º al 10.º juegan el Play-In.</p></div>`;
    return html + updNote(c);

  if(c==="euroliga"){
    const rows = elRows();

    if(pi.length) html += `<div class="card"><h2>Play-In</h2>${pi.map(g=>single(c,g)).join("")}</div>`;
    else html += `<div class="card"><h2>Play-In <span class="badge">si acabara hoy</span></h2>${proj(t(7,rows,"pos"), t(8,rows,"pos"), "El ganador es el 7.º; el perdedor juega por el 8.º")}${proj(t(9,rows,"pos"), t(10,rows,"pos"), "El perdedor queda eliminado")}</div>`;
    if(po.length) html += `<div class="card"><h2>Playoffs</h2>${seriesOf(po).map(s=>seriesCard(c,s,3)).join("")}</div>`;
    else html += `<div class="card"><h2>Playoffs <span class="badge">si acabara hoy</span></h2>${proj(t(1,rows,"pos"),"8.º (Play-In)")}${proj(t(4,rows,"pos"),t(5,rows,"pos"))}${proj(t(3,rows,"pos"),t(6,rows,"pos"))}${proj(t(2,rows,"pos"),"7.º (Play-In)")}<p class="note">Series al mejor de 5. Los ganadores juegan la Final Four.</p></div>`;
    html += `<div class="card"><h2>Final Four</h2>${ff.length ? ff.map(g=>single(c,g)).join("") : `<p class="note">Semifinales y final a partido único entre los cuatro ganadores de los playoffs.</p>`}</div>`;
    return html + updNote(c);
  }
  // ACB
  const rows = proStandings("acb"), po = D.games.filter(g=>g.j==null);
  if(po.length){ const names = {1:"Cuartos de final", 2:"Semifinales", 3:"Final"};
    const ser = seriesOf(po); [1,2,3].forEach(r=>{ const x = ser.filter(s=>s.round===r); if(x.length) html += `<div class="card"><h2>${names[r]}</h2>${x.map(s=>seriesCard(c,s,r===1?2:3)).join("")}</div>`; }); }
  else html += `<div class="card"><h2>Cuartos de final <span class="badge">si acabara hoy</span></h2>${proj(t(1,rows,"pos"),t(8,rows,"pos"))}${proj(t(4,rows,"pos"),t(5,rows,"pos"))}${proj(t(2,rows,"pos"),t(7,rows,"pos"))}${proj(t(3,rows,"pos"),t(6,rows,"pos"))}
    <p class="note">Cuartos al mejor de 3; semifinales (ganador 1-8 contra ganador 4-5 y ganador 2-7 contra ganador 3-6) y final al mejor de 5. Formato de la temporada pasada: compruébalo cuando la ACB publique el de este año.</p></div>`;
  return html + updNote(c);
}

function rosterInfo(pid){ if(ROST) for(const [t,l] of Object.entries(ROST.teams)){ const p = l.find(x=>x.id===pid); if(p) return {...p, t}; } return null; }

  const j = NBAJ[pid], r = rosterInfo(pid);

function nbaTotals(p){ const t = {pj:0,p:0,r:0,t:0,f:0,min:0,max:0};
  for(const x of Object.values(p.g)){ t.pj++; t.p+=x[0]; t.r+=x[1]; t.t+=x[2]; t.f+=x[3]; t.min+=x[4]; t.max = Math.max(t.max, x[0]); } return t; }

  for(const pid of want) if(!nbajSubs[pid] && /^[\w-]{1,20}$/.test(pid))
    nbajSubs[pid] = fb.onSnapshot(fb.doc(db, "nbaj", pid), snap => { NBAJ[pid] = snap.exists() ? normNbaj(snap.data()) : null; if(phase==="app" && comp==="nba") scheduleRender(); }, e => console.warn(e));

    savePrefs(o); if(!v.includes(comp)) comp = v[0]; syncNbaj(); render(); });
  const ic = $("icomp"); if(ic) ic.onchange = e => savePrefs({inicioComp:e.target.value});
  app.querySelectorAll("[data-eq]").forEach(s=>s.onchange=()=>{ const eq = {...(P.equipos||{})}; if(s.value) eq[s.dataset.eq] = s.value; else delete eq[s.dataset.eq]; savePrefs({equipos:eq}); });
  if(!isAdmin) return;
  const saveEsp = () => w(fb.setDoc(fb.doc(db, "compadmin", "nba"), {espanoles:{add:ESPA.add, quitar:ESPA.quitar}}), "Lista de españoles guardada");
  app.querySelectorAll("[data-esq]").forEach(b=>b.onclick=()=>{ const id = b.dataset.esq;
    ESPA.add = ESPA.add.filter(x=>x!==id); if(ROST && ROST.esp.includes(id) && !ESPA.quitar.includes(id)) ESPA.quitar.push(id);
    saveEsp(); syncNbaj(); render(); });
  const t = $("esT"), p = $("esP");
  if(t) t.onchange = () => { p.innerHTML = `<option value="">Jugador…</option>` + ((ROST && ROST.teams[t.value]) || []).slice().sort((a,b)=>a.n.localeCompare(b.n,"es")).map(x=>`<option value="${esc(x.id)}">${esc(x.n)}</option>`).join(""); };
  const add = $("esAdd"); if(add) add.onclick = () => { const id = p && p.value; if(!id) return;
    ESPA.quitar = ESPA.quitar.filter(x=>x!==id); if(!espSet().includes(id)) ESPA.add.push(id);
    saveEsp(); syncNbaj(); render(); };
}
function bindPro(){

    else{ const sel = $("rsel"), keys = sel ? [...sel.options].map(o=>o.value) : [];

  }

    on("nback", () => { if(history.state && history.state.det) history.back(); else go("jug"); });

}
function switchComp(c){
  if(!visibleComps().includes(c) || c===comp) return;
  if(history.state && history.state.det) history.replaceState(null, "", location.href);
  comp = c; view = "list"; proCur = null;
  if(!NAVS[c].some(x=>x[0]===tab)) tab = "clas";
  history.replaceState(null, "", "#"+c+"/"+tab); render(); window.scrollTo(0,0);
}

/* ========== Render, navegación y eventos ========== */
const app = $("app");
let renderPending = false;
const editing = () => dlg.open || (document.activeElement && document.activeElement!==document.body && document.activeElement.matches && document.activeElement.matches("input,textarea"));
function scheduleRender(){ if(editing()){ renderPending = true; setSt(); return; } render(); }
function maybeRender(){ if(renderPending && !editing()){ renderPending = false; render(); } }
document.addEventListener("focusout", () => setTimeout(maybeRender, 0));

function render(){
  renderPending = false;
  document.body.classList.toggle("lock", phase!=="app");
  setSt();
  if(phase!=="app"){ if(dlg.open) closeDlg(); app.innerHTML = vPhase(); bindPhase(); return; }
  M = effMatches();
  if(!visibleComps().includes(comp)) comp = visibleComps()[0];
  if(!NAVS[comp].some(x=>x[0]===tab)) tab = "clas";
  $("ttl").textContent = COMPS[comp].t;
  $("sub").textContent = comp==="nba" && PRO.nba && PRO.nba.season ? `Temporada ${PRO.nba.season-1}-${String(PRO.nba.season).slice(2)}` : COMPS[comp].sub;
  const nav = $("nav");
  nav.innerHTML = NAVS[comp].map(([t,ic,l])=>`<button data-t="${t}" class="${t===tab?"on":""}"><span>${ic}</span>${l}${t==="aju"?`<i class="dot hide" id="dot"></i>`:""}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(phase==="app") go(b.dataset.t); });
  const pend = isAdmin ? usersList.filter(u=>u.estado==="pendiente").length : 0;
  const dot = $("dot"); dot.textContent = pend; dot.classList.toggle("hide", !pend);
  if(isAdmin && lastPending>=0){ if(pend>lastPending) toast("Nueva solicitud de acceso"); lastPending = pend; }
  const vc = visibleComps();
  const bar = vc.length>1 ? `<div class="cbar">${vc.map(c=>`<button class="cb ${c===comp?"on":""}" data-comp="${c}">${esc(COMPS[c].n)}</button>`).join("")}</div>` : "";
  let html;
  if(tab==="aju") html = vAju();
  else if(comp!=="cadete") html = tab==="clas" ? vProClas(comp) : tab==="part" ? vProPart(comp) : tab==="po" ? vProPO(comp) : vNbaJug();
  else if(tab==="clas") html = vClas();
  else if(tab==="part") html = vPart();
  else{ const p = curPlayer(); html = view==="det" && p ? vJugDet(p) : (view = "list", vJugList()); }
  app.innerHTML = bar + html;
  bind();
}
let pendingTab = null;
function go(t){
  if(history.state && history.state.det){ pendingTab = t; history.back(); return; }
  tab = t; view = "list"; proCur = null; history.replaceState(null, "", "#"+comp+"/"+t); render(); window.scrollTo(0,0);
}
function openPlayer(id){ cur = id; view = "det"; history.pushState({det:1}, "", "#cadete/jug/"+encodeURIComponent(id)); render(); window.scrollTo(0,0); }
// Enlaces: #competición/pantalla[/jugador]; los antiguos (#clas, #jug/id…) son del Cadete B
function route(){
  let h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  let parts = h.split("/").filter(Boolean);
  if(parts.length && !COMP_IDS.includes(parts[0])) parts = ["cadete", ...parts];
  const vc = visibleComps();
  comp = parts.length && vc.includes(parts[0]) ? parts[0] : (P && vc.includes(P.inicioComp) ? P.inicioComp : vc[0]);
  const tabs = NAVS[comp].map(x=>x[0]);
  tab = tabs.includes(parts[1]) ? parts[1] : (!parts.length && P && tabs.includes(P.inicio) ? P.inicio : "clas");
  view = "list"; proCur = null;
  if(tab==="jug" && parts[2]){
    if(comp==="cadete" && P && P.players.some(p=>p.id===parts[2])){ cur = parts[2]; view = "det"; }
    else if(comp==="nba"){ proCur = parts[2]; view = "det"; syncNbaj(); }
  }
}
window.addEventListener("popstate", () => {
  if(dlg.open){ closeDlg(); return; }
  if(phase!=="app") return;
  if(pendingTab){ const t = pendingTab; pendingTab = null; go(t); return; }
  route(); render(); });

function bind(){
  const on = (id, fn, ev) => { const el = $(id); if(el) el[ev||"onclick"] = fn; };
  app.querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>switchComp(b.dataset.comp));
  if(comp!=="cadete" && tab!=="aju"){ bindPro(); return; }
  if(tab==="part"){
    app.querySelectorAll("[data-vp]").forEach(b=>b.onclick=()=>{ savePrefs({vistaPart:b.dataset.vp}); render(); });
    const goJ = j => { jor = Math.min(nj(), Math.max(1,j)); render(); };
    on("pj", () => goJ(jor-1)); on("nj", () => goJ(jor+1)); on("sj", e => goJ(+e.target.value), "onchange");
    app.querySelectorAll(".sc").forEach(inp=>inp.oninput=()=>{ inp.value = inp.value.replace(/\D/g,"").slice(0,3);
      const m = Lm(inp.dataset.id); if(!m) return; m.s[+inp.dataset.k] = num(inp.value); saveScore(m); });
    app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>openMatch(b.dataset.e));
  }
  if(tab==="jug"){
    on("padd", () => { if(P.players.length>=MAXP){ alert("Has llegado al máximo de "+MAXP+" jugadores."); return; }
      const name = cleanName(prompt("Nombre del jugador (puedes usar solo nombre o iniciales):")); if(!name) return;
      const p = {id:uid(), name:name.slice(0,60), num:"", team:P.myTeam||"", stats:{}, c:Math.max(0,...P.players.map(x=>x.c))+1};
      P.players.push(p); savePlayer(p); openPlayer(p.id); });
    if(view==="list"){
      app.querySelectorAll("[data-avg]").forEach(b=>b.onclick=()=>{ savePrefs({avg:b.dataset.avg==="1"}); render(); });
      app.querySelectorAll("[data-sort]").forEach(th=>th.onclick=()=>{ savePrefs({sort:th.dataset.sort}); render(); });
      app.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>openPlayer(tr.dataset.id));
      return;
    }
    const p = curPlayer();
    on("back", () => { if(history.state && history.state.det) history.back(); else go("jug"); });
    on("ps", e => { cur = e.target.value; history.replaceState({det:1}, "", "#jug/"+encodeURIComponent(cur)); render(); }, "onchange");
    on("pn", e => { const n = cleanName(e.target.value).slice(0,60); if(!n) return; p.name = n;
      const o = [...$("ps").options].find(x=>x.value===p.id); if(o) o.textContent = n; savePlayer(p, true); }, "oninput");
    on("pn", e => { if(!cleanName(e.target.value)) e.target.value = p.name; }, "onblur");
    on("pd", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,3); p.num = e.target.value; savePlayer(p, true); }, "oninput");
    on("pt", e => { p.team = e.target.value; savePlayer(p); render(); }, "onchange");
    app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ savePrefs({chart:b.dataset.ch}); render(); });
    app.querySelectorAll(".jr[data-j]").forEach(r=>{ r.onclick = () => openStat(p, +r.dataset.j);
      r.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openStat(p, +r.dataset.j); } }; });
    on("pdel", () => { if(!confirm("¿Eliminar a "+p.name+" y todos sus datos?")) return;
      P.players = P.players.filter(x=>x!==p); delPlayer(p); cur = null; go("jug"); });
  }
  if(tab==="aju"){
    bindProAju();
    on("cpy", copyUid);
    on("out", logout);
    on("pwd", () => { if(!confirm("Te enviaremos un correo a "+user.email+" con un enlace para elegir una contraseña nueva. ¿Enviar?")) return;
      fb.sendPasswordResetEmail(auth, user.email).then(()=>toast("Correo enviado")).catch(e=>toast(authErr(e))); });
    on("mt", e => { savePrefs({myTeam:e.target.value}); }, "onchange");
    on("pi", e => { savePrefs({inicio:e.target.value}); }, "onchange");
    on("pv", e => { savePrefs({vistaPart:e.target.value}); }, "onchange");
    app.querySelectorAll("[data-ua]").forEach(b=>b.onclick=()=>{
      const u = usersList.find(x=>x.id===b.dataset.uid); if(!u) return; const a = b.dataset.ua;
      if(a==="borrar"){ if(confirm("¿Borrar la solicitud de "+(u.nombre||u.email)+"? Podrá volver a pedir acceso.")) w(fb.deleteDoc(R.usuario(u.id)), "Solicitud borrada"); return; }
      if(a==="rechazado" && u.estado==="aprobado" && !confirm("¿Quitar el acceso a "+(u.nombre||u.email)+"?")) return;
      w(fb.updateDoc(R.usuario(u.id), {estado:a}), a==="aprobado" ? "Acceso aprobado" : "Acceso denegado"); });
    if(isAdmin){
      const setN = (id,k) => on(id, e => { const n = parseFloat(e.target.value); L[k] = Number.isFinite(n) ? n : 0; e.target.value = L[k];
        w(fb.updateDoc(R.liga(), {[k]: L[k]})); }, "onchange");
      setN("aw","win"); setN("al","loss"); setN("ad","draw");
      app.querySelectorAll("[data-rn]").forEach(b=>b.onclick=()=>renameTeam(+b.dataset.rn));
    }
    on("exp", exportData);
    on("imp", () => $("file").click());
    on("file", e => importData(e.target), "onchange");
    on("inst", async () => { const ev = deferredPrompt; deferredPrompt = null; ev.prompt(); try{ await ev.userChoice; }catch(x){} render(); });
    on("rstp", () => { if(!confirm("¿Borrar todos tus jugadores y sus estadísticas? Podrás recuperarlos desde aquí mismo.")) return;
      backupPrev(false); P.players = []; w(fb.updateDoc(R.perfil(), {players:{}}), "Jugadores borrados"); render(); });
    on("rstl", () => { if(!confirm("¿Borrar TODOS los resultados manuales e incomparecencias? Los oficiales se mantienen.")) return;
      backupPrev(true); const upd = {};
      L.matches.forEach(m=>{ m.s = [null,null]; m.np = ""; upd["matches."+m.id+".s"] = [null,null]; upd["matches."+m.id+".np"] = ""; });
      w(fb.updateDoc(R.liga(), upd), "Resultados manuales borrados"); render(); });
    on("undo", () => { const pv = prevData(); if(!pv) return;
      if(!confirm("Se recuperarán tus datos de "+fdt(new Date(pv.savedAt))+(pv.liga?" (también la liga)":"")+" y se perderán los actuales. ¿Continuar?")) return;
      const curDoc = {uid:user.uid, savedAt:new Date().toISOString(), perfil:perfilToDoc(P), liga:pv.liga && isAdmin ? ligaToDoc(L) : null};
      if(pv.liga && isAdmin) w(fb.setDoc(R.liga(), pv.liga));
      w(fb.setDoc(R.perfil(), pv.perfil), "Datos recuperados");
      P = normPerfil(pv.perfil); try{ localStorage.setItem(PREV_KEY, JSON.stringify(curDoc)); }catch(e){} render(); });
  }
}
function renameTeam(i){
  const t = L.teams[i], n = cleanName(prompt("Nuevo nombre del equipo (como aparece en la web oficial):", t.n)).slice(0,60);
  if(!n || n===t.n) return;
  if(L.teams.some((x,k)=>k!==i && normName(x.n)===normName(n))){ alert("Ya existe un equipo con ese nombre."); return; }
  t.n = n; L.tname[t.id] = n; saveTeams(); render(); toast("Equipo renombrado");
}
function exportData(){
  const name = "cadeteB_copia_"+todayLocal()+".json";
  const data = {v:3, app:"cadeteB", savedAt:new Date().toISOString(), liga:ligaToDoc(L), oficial:O, perfil:perfilToDoc(P)};
  const file = new File([JSON.stringify(data,null,1)], name, {type:"application/json"});
  if(isIOS && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(e=>{ if(e.name!=="AbortError") alert("No se ha podido compartir la copia: "+e.message); });
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
  toast("Copia generada: "+name);
}
function importData(input){
  const f = input.files && input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { input.value = "";
    let d, plan;
    try{ d = JSON.parse(rd.result);
      if(+d.v > 3){ alert("Esta copia es de una versión más nueva de la app. Actualiza la app antes de importarla."); return; }
      if(+d.v===3){ if(!d.liga || !d.perfil) throw 0;
        const ln = normLiga(d.liga), pp = normPerfil(d.perfil), nm = id => ln.tname[id] || "";
        plan = {liga:ln, src:{myTeamName:nm(pp.myTeam), players:pp.players.map(p=>({...p, teamName:nm(p.team)})), prefs:pp}};
      } else {
        if(!d || !Array.isArray(d.players) || !(d.scores || d.matches)) throw 0;
        const v2 = normalizeV2(d);
        plan = {liga:normLiga(ligaFromV2(v2)), src:{myTeamName:v2.myTeam, players:v2.players.map(p=>({...p, teamName:p.team})), prefs:v2}};
      }
    }catch(x){ alert("El archivo no es una copia válida de esta app."); return; }
    const nRes = plan.liga.matches.filter(played).length;
    const conLiga = isAdmin && nRes>0 && confirm(`La copia incluye ${nRes} resultados manuales de la liga.\n¿Importar también el calendario y esos resultados?\n(Aceptar: sí · Cancelar: solo mis jugadores y preferencias)`);
    const perfil = perfilFromSrc(plan.src, conLiga ? plan.liga : L);
    const nPl = Object.keys(perfil.players).length;
    if(!confirm(`Se importarán ${nPl} jugadores${conLiga?` y ${nRes} resultados de la liga`:""}. Sustituirán a tus datos actuales. ¿Continuar?`)) return;
    backupPrev(conLiga);
    if(conLiga) w(fb.setDoc(R.liga(), ligaToDoc(plan.liga)));
    w(fb.setDoc(R.perfil(), perfil), "Copia importada. Puedes deshacerlo en Ajustes.");
    P = normPerfil(perfil); view = "list"; render(); };
  rd.onerror = () => { input.value = ""; alert("No se ha podido leer el archivo."); };
  rd.readAsText(f);
}

/* ========== Instalación, actualización y arranque ========== */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if(phase==="app" && tab==="aju") render(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; toast("App instalada"); if(phase==="app" && tab==="aju") render(); });
window.addEventListener("pagehide", flushTimers);
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden") flushTimers(); });
if("serviceWorker" in navigator && location.protocol!=="file:"){
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadSW) $("upd").classList.remove("hide"); });
  $("updb").onclick = () => { flushTimers(); location.reload(); };
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r=>{
    document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") r.update().catch(()=>{}); });
  }).catch(e=>console.warn(e)));
}
const startTimer = setTimeout(() => { if(!started){ fatalMsg = "No se ha podido cargar la app. Comprueba la conexión y vuelve a intentarlo (si el problema sigue, actualiza el navegador)."; phase = "error"; render(); } }, 20000);

function start(fbMod, cfgMod){
  if(started) return; started = true; clearTimeout(startTimer);
  fb = fbMod; cfg = cfgMod || {};
  const c = cfg.firebaseConfig || {};
  if(!c.apiKey || !c.projectId){ phase = "config"; render(); return; }
  try{
    const fapp = fb.initializeApp(c);
    auth = fb.initializeAuth(fapp, {persistence:[fb.indexedDBLocalPersistence, fb.browserLocalPersistence]});
    try{ db = fb.initializeFirestore(fapp, {localCache: fb.persistentLocalCache({tabManager: fb.persistentMultipleTabManager()})}); }
    catch(e){ console.warn("Sin caché persistente:", e); db = fb.initializeFirestore(fapp, {localCache: fb.memoryLocalCache()}); }
    fb.onAuthStateChanged(auth, onUser);
  }catch(e){ console.error(e); fatal("No se ha podido iniciar Firebase: "+errText(e)+". Revisa config.js."); }
}
function fatalLoad(e){ console.error(e); started = true; clearTimeout(startTimer); fatal("No se ha podido cargar la app ("+((e&&e.message)||e)+"). Comprueba la conexión y vuelve a intentarlo."); }
return {start, fatal:fatalLoad, _dbg:()=>({phase, tab, view, isAdmin, L, O, P, M, U, usersList, jor, cur})};
})();
</script>
<script type="module">
Promise.all([import("./firebase.js"), import("./config.js")]).then(([fb, cfg]) => App.start(fb, cfg)).catch(e => App.fatal(e));
</script>
